<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#111822"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#30363d"/>
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,monospace; }
      .sans { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- window -->
  <rect x="8" y="8" width="1184" height="304" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="8" y="8" width="1184" height="304" rx="16" fill="url(#glow)"/>
  <rect x="760" y="56" width="424" height="248" fill="url(#dots)" opacity="0.6"/>

  <!-- title bar -->
  <path d="M24 8 H1176 A16 16 0 0 1 1192 24 V48 H8 V24 A16 16 0 0 1 24 8 Z" fill="#161b22"/>
  <line x1="8" y1="48" x2="1192" y2="48" stroke="#30363d"/>
  <circle cx="36" cy="28" r="7" fill="#ff5f56"/>
  <circle cx="60" cy="28" r="7" fill="#ffbd2e"/>
  <circle cx="84" cy="28" r="7" fill="#27c93f"/>
  <text x="600" y="33" text-anchor="middle" class="mono" font-size="14" fill="#8b949e">stanislav@remote: ~/profile</text>

  <!-- prompt -->
  <text x="48" y="96" class="mono" font-size="20"><tspan fill="#3fb950">➜</tspan><tspan fill="#58a6ff"> ~</tspan><tspan fill="#c9d1d9"> whoami</tspan></text>

  <!-- name -->
  <text x="46" y="168" class="sans" font-size="58" font-weight="700" fill="#e6edf3" letter-spacing="-1">Stanislav Remyhailo</text>

  <!-- role -->
  <text x="48" y="210" class="mono" font-size="21" fill="#3fb950">Senior Full-Stack Engineer<tspan fill="#8b949e"> · 6+ YOE · Web + Mobile + AI</tspan></text>

  <!-- tags -->
  <g class="mono" font-size="15">
    <rect x="48" y="232" width="78" height="30" rx="6" fill="#1f2937" stroke="#30363d"/>
    <text x="87" y="252" text-anchor="middle" fill="#79c0ff">React</text>
    <rect x="136" y="232" width="92" height="30" rx="6" fill="#1f2937" stroke="#30363d"/>
    <text x="182" y="252" text-anchor="middle" fill="#79c0ff">Node.js</text>
    <rect x="238" y="232" width="118" height="30" rx="6" fill="#1f2937" stroke="#30363d"/>
    <text x="297" y="252" text-anchor="middle" fill="#79c0ff">TypeScript</text>
    <rect x="366" y="232" width="134" height="30" rx="6" fill="#1f2937" stroke="#30363d"/>
    <text x="433" y="252" text-anchor="middle" fill="#79c0ff">React Native</text>
    <rect x="510" y="232" width="62" height="30" rx="6" fill="#1f2937" stroke="#30363d"/>
    <text x="541" y="252" text-anchor="middle" fill="#d2a8ff">LLM</text>
  </g>

  <!-- next prompt with cursor -->
  <text x="48" y="292" class="mono" font-size="18"><tspan fill="#3fb950">➜</tspan><tspan fill="#58a6ff"> ~</tspan></text>
  <rect class="cursor" x="88" y="277" width="11" height="20" fill="#c9d1d9"/>

  <!-- right badge -->
  <g transform="translate(1040 150)">
    <circle r="62" fill="none" stroke="#3fb950" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle r="44" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
    <text y="-4" text-anchor="middle" class="mono" font-size="15" fill="#3fb950">open</text>
    <text y="16" text-anchor="middle" class="mono" font-size="15" fill="#3fb950">to work</text>
  </g>
</svg>
